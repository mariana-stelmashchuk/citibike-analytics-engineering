version: 2

models:
  - name: dim_stations
    description: >
      One row per station with its current attributes. Combines the latest GBFS snapshot
      (official name, coordinates, capacity) with stations seen only in trips (closed
      before GBFS loading started). For point-in-time attributes use dim_stations_history.

    columns:
      - name: station_id
        description: "Station id used in trips"
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: gbfs_station_id
        description: "Lyft's internal station id; null for stations not in GBFS"
        data_type: string

      - name: station_name
        description: "Current station name from GBFS, or from the latest trip for stations not in GBFS"
        data_type: string
        data_tests:
          - not_null

      - name: region_id
        description: "GBFS region id; null for stations not in GBFS"
        data_type: string

      - name: capacity
        description: "Number of docks; 0 means the station is currently removed; null for stations not in GBFS"
        data_type: int64

      - name: is_charging
        description: "True if the station charges e-bikes; null for stations not in GBFS"
        data_type: boolean

      - name: station_lat
        description: "Latitude of the station"
        data_type: float64

      - name: station_lng
        description: "Longitude of the station"
        data_type: float64

      - name: is_in_gbfs
        description: "True if the station is in the latest GBFS snapshot; false for stations seen only in trips"
        data_type: boolean

      - name: first_trip_at
        description: "Earliest trip event (start or end) at the station within the loaded data window, in UTC; not the station opening date; null if no trips"
        data_type: timestamp

      - name: last_trip_at
        description: "Latest trip event (start or end) at the station within the loaded data window, in UTC; null if no trips"
        data_type: timestamp

  - name: dim_stations_history
    description: >
      SCD Type 2: one row per version of a station. Versions come from the snp_stations
      snapshot of daily GBFS loads. The first known version of each station is treated as
      valid from 1900-01-01, because history before the first GBFS snapshot is unknown.
      Stations seen only in trips get a single version valid for all time. Join to trips
      with started_at >= valid_from and started_at < valid_to.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_id
              - valid_from
      - dbt_utils.mutually_exclusive_ranges:
          arguments:
            lower_bound_column: valid_from
            upper_bound_column: valid_to
            partition_by: station_id
            gaps: allowed

    columns:
      - name: station_version_key
        description: "Surrogate key of the station version (station_id + valid_from)"
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: station_id
        description: "Station id used in trips"
        data_type: string
        data_tests:
          - not_null

      - name: gbfs_station_id
        description: "Lyft's internal station id; null for stations not in GBFS"
        data_type: string

      - name: station_name
        description: "Station name in this version"
        data_type: string

      - name: region_id
        description: "GBFS region id in this version"
        data_type: string

      - name: capacity
        description: "Number of docks in this version; 0 means the station was removed"
        data_type: int64

      - name: is_charging
        description: "True if the station charged e-bikes in this version"
        data_type: boolean

      - name: station_lat
        description: "Latitude of the station in this version"
        data_type: float64

      - name: station_lng
        description: "Longitude of the station in this version"
        data_type: float64

      - name: valid_from
        description: "Start of the version validity (inclusive), UTC; 1900-01-01 for the first known version"
        data_type: timestamp

      - name: valid_to
        description: "End of the version validity (exclusive), UTC; 9999-12-31 for the current version"
        data_type: timestamp

      - name: is_in_gbfs
        description: "True if the version comes from GBFS; false for stations seen only in trips"
        data_type: boolean

      - name: is_current
        description: "True for the version valid now"
        data_type: boolean

  - name: dim_date
    description: >
      One row per calendar day from 2025-01-01 to one year ahead, in New York local time.
      Joins to trips on started_date_local. Generated with dbt_utils.date_spine.

    columns:
      - name: date_day
        description: "Calendar date in New York local time; primary key"
        data_type: date
        data_tests:
          - unique
          - not_null

      - name: year
        description: "Calendar year"
        data_type: int64

      - name: quarter
        description: "Calendar quarter (1-4)"
        data_type: int64

      - name: month
        description: "Month number (1-12)"
        data_type: int64

      - name: month_name
        description: "Full month name, e.g. January"
        data_type: string

      - name: iso_week
        description: "ISO week number"
        data_type: int64

      - name: day_of_week
        description: "Day of week in BigQuery convention: 1 = Sunday, 7 = Saturday"
        data_type: int64

      - name: day_name
        description: "Full day name, e.g. Monday"
        data_type: string

      - name: is_weekend
        description: "True for Saturday and Sunday"
        data_type: boolean

      - name: month_start_date
        description: "First day of the month"
        data_type: date

      - name: week_start_date
        description: "First day of the ISO week (Monday)"
        data_type: date
  
  - name: fct_trips
    description: >
      One row per trip. Core trips fact table with duration, distance and trip flags.
      Station names and coordinates live in dim_stations; dates join to dim_date
      on started_date_local. Source files are published by the month a trip ended,
      so trip counts for a month by start date are final only after the next
      month's file is loaded. Incremental with insert_overwrite, partitioned by
      _batch_month (the source file month) and clustered by started_date_local:
      filter on started_date_local for analysis, clustering limits the data scanned.

    columns:
      - name: ride_id
        description: "Unique identifier of the trip"
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: start_station_id
        description: "Identifier of the station where the trip started; null for some e-bike trips that started outside a dock"
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id

      - name: end_station_id
        description: "Identifier of the station where the trip ended; null for e-bikes left outside a dock and for unreturned bikes"
        data_type: string
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id

      - name: rideable_type
        description: "Type of bike used: classic_bike or electric_bike"
        data_type: string

      - name: rider_type
        description: "Type of rider: member (subscriber) or casual"
        data_type: string

      - name: duration_minutes
        description: "Trip duration in minutes, computed from UTC timestamps so daylight saving changes do not distort it"
        data_type: float64

      - name: distance_km
        description: "Straight-line distance between start and end points in kilometers; null when end coordinates are missing"
        data_type: float64

      - name: has_end_station
        description: "True when the trip ended at a known station"
        data_type: boolean

      - name: is_round_trip
        description: "True when the trip started and ended at the same station"
        data_type: boolean

      - name: is_over_24h
        description: "True when the trip lasted longer than 24 hours; likely an unreturned bike"
        data_type: boolean
      
      - name: is_dst_adjusted
        description: "True when ended_at was shifted by one hour because the trip crossed the repeated hour at the end of DST and otherwise had a negative duration. Trips that crossed that hour without a negative duration cannot be detected and may be off by up to one hour"
        data_type: boolean

      - name: started_date_local
        description: "Trip start date in New York local time; join key to dim_date"
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: started_hour_local
        description: "Hour of trip start in New York local time (0-23)"
        data_type: int64

      - name: started_at_local
        description: "Trip start time in New York local time"
        data_type: datetime

      - name: started_at
        description: "Trip start time in UTC, converted from America/New_York local time"
        data_type: timestamp

      - name: ended_at_local
        description: "Trip end time in New York local time"
        data_type: datetime

      - name: ended_at
        description: "Trip end time in UTC, converted from America/New_York local time. On the day DST ends, trips that start in the first repeated hour and end in the second one are shifted by one hour (see is_dst_adjusted)"
        data_type: timestamp

      - name: _batch_month
        description: "Month of the source file the trip was loaded from; partition key of this table"
        data_type: date

  - name: fct_station_daily
    description: >
      One row per station per local day with at least one departure or arrival.
      Departures are counted by trip start date, arrivals by trip end date, both in
      New York local time. Days without any activity are not included; use
      dim_stations × dim_date to build a dense grid if needed. Trips without a
      station on the respective side are excluded. Counts for the most recent
      days may change after the next monthly file is loaded.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_id
              - date_day

    columns:
      - name: station_id
        description: "Identifier of the station"
        data_type: string
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id

      - name: date_day
        description: "Calendar date in New York local time; join key to dim_date"
        data_type: date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: departures_cnt
        description: "Number of trips that started at the station on this day"
        data_type: int64

      - name: member_departures_cnt
        description: "Number of trips by members (subscribers) that started at the station on this day"
        data_type: int64

      - name: casual_departures_cnt
        description: "Number of trips by casual riders that started at the station on this day"
        data_type: int64

      - name: electric_departures_cnt
        description: "Number of e-bike trips that started at the station on this day"
        data_type: int64

      - name: arrivals_cnt
        description: "Number of trips that ended at the station on this day"
        data_type: int64

      - name: member_arrivals_cnt
        description: "Number of trips by members (subscribers) that ended at the station on this day"
        data_type: int64

      - name: casual_arrivals_cnt
        description: "Number of trips by casual riders that ended at the station on this day"
        data_type: int64

      - name: electric_arrivals_cnt
        description: "Number of e-bike trips that ended at the station on this day; e-bikes need charging where they end"
        data_type: int64

      - name: net_flow
        description: "arrivals_cnt minus departures_cnt; positive means the station accumulated bikes, negative means it lost bikes"
        data_type: int64