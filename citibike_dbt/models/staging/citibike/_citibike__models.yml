version: 2

models:
  - name: stg_citibike__trips
    description: >
      One row per row in the source files. Renamed Citi Bike trips with timestamps
      converted from New York local wall-clock time to proper UTC. Not deduplicated:
      a trip can appear in two monthly files; see int_trips__deduplicated.

    columns:
      # ids
      - name: ride_id
        description: "Identifier of the trip; not unique here, as a trip can appear in two source files"
        data_type: string
        data_tests:
          - not_null

      - name: start_station_id
        description: "Identifier of the station where the trip started, as published; null for some e-bike trips that started outside a dock. Some ids lost a trailing zero in the source (5785.1 instead of 5785.10); repaired in int_trips__deduplicated"
        data_type: string
        data_tests:
          - not_null:
              config:
                where: "rideable_type = 'classic_bike'"

      - name: end_station_id
        description: "Identifier of the station where the trip ended, as published; null for e-bikes left outside a dock and for unreturned bikes. Some ids lost a trailing zero in the source (5785.1 instead of 5785.10); repaired in int_trips__deduplicated"
        data_type: string

      # attributes
      - name: rideable_type
        description: "Type of bike used: classic_bike or electric_bike"
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['classic_bike', 'electric_bike']

      - name: rider_type
        description: "Type of rider: member (subscriber) or casual"
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['member', 'casual']

      - name: start_station_name
        description: "Name of the station where the trip started, as recorded on the trip"
        data_type: string

      - name: end_station_name
        description: "Name of the station where the trip ended, as recorded on the trip"
        data_type: string

      # coordinates
      - name: start_lat
        description: "Latitude of the trip start point"
        data_type: float64

      - name: start_lng
        description: "Longitude of the trip start point"
        data_type: float64

      - name: end_lat
        description: "Latitude of the trip end point"
        data_type: float64

      - name: end_lng
        description: "Longitude of the trip end point"
        data_type: float64

      # timestamps
      - name: started_at_local
        description: "Trip start time in New York local time"
        data_type: datetime

      - name: started_at
        description: "Trip start time in UTC, converted from America/New_York local time"
        data_type: timestamp
        data_tests:
          - not_null

      - name: ended_at_local
        description: "Trip end time in New York local time"
        data_type: datetime

      - name: ended_at
        description: "Trip end time in UTC, converted from America/New_York local time. On the day DST ends, trips that start in the first repeated hour and end in the second one are shifted by one hour (see is_dst_adjusted)"
        data_type: timestamp
        data_tests:
          - not_null

      # flags
      - name: is_dst_adjusted
        description: "True when ended_at was shifted by one hour because the trip crossed the repeated hour at the end of DST and otherwise had a negative duration. Trips that crossed that hour without a negative duration cannot be detected and may be off by up to one hour"
        data_type: boolean

      # metadata
      - name: _source_file
        description: "Name of the source CSV file the row was loaded from"
        data_type: string

      - name: _batch_month
        description: "Month of the source file the row was loaded from"
        data_type: date

      - name: _loaded_at
        description: "Timestamp when the source file was converted to Parquet before loading"
        data_type: timestamp

  - name: stg_citibike__station_information
    description: "One row per station per snapshot date. Renamed GBFS station information; station_id is the id used in trips."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - station_id
              - _snapshot_date

    columns:
      - name: station_id
        description: "Station id used in trips (GBFS short_name)"
        data_type: string
        data_tests:
          - not_null

      - name: gbfs_station_id
        description: "Lyft's internal station id (GBFS station_id)"
        data_type: string
        data_tests:
          - not_null

      - name: station_name
        description: "Station name"
        data_type: string

      - name: region_id
        description: "GBFS region id (e.g. New York City, Jersey City)"
        data_type: string

      - name: capacity
        description: "Number of docks; 0 means the station is currently removed (not installed)"
        data_type: int64
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: is_charging
        description: "True if the station charges e-bikes"
        data_type: boolean

      - name: station_lat
        description: "Latitude of the station"
        data_type: float64

      - name: station_lng
        description: "Longitude of the station"
        data_type: float64

      - name: _feed_last_updated
        description: "Time the GBFS feed was last updated by Citi Bike when the snapshot was taken"
        data_type: timestamp

      - name: _snapshot_date
        description: "Date (UTC) the snapshot was taken"
        data_type: date

      - name: _loaded_at
        description: "Time the snapshot was converted to Parquet before loading"
        data_type: timestamp